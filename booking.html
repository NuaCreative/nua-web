<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking | NUA Studio</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f8f8;
      color: #222;
    }

    header {
      background-color: #20036e;
      color: #fff;
      padding: 20px 0;
      text-align: center;
      position: relative;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    /* Tombol Kembali */
    .back-btn {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      text-decoration: none;
      font-size: 20px;
    }

    section {
      padding: 50px 20px;
      text-align: center;
    }

    form {
      max-width: 600px;
      margin: 0 auto;
      text-align: left;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    form label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    form input, form select, form textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
    }

    form button {
      background-color: #20036e;
      color: #fff;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
    }

    form button:hover {
      background-color: #3506a0;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <a href="index.html" class="back-btn"><i class="fa fa-arrow-left"></i></a>
    <h1>Booking NUA Studio</h1>
  </header>

  <!-- CONTENT -->
  <section>
    <h2>Form Pemesanan Layanan</h2>
    <p>Isi data berikut untuk melakukan booking layanan desain kami.</p>

    <!-- FORM WA -->

      <label for="nama">Nama Lengkap:</label>
      <input type="text" id="nama" name="nama" placeholder="Nama lengkap Anda" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Email Anda" required>

      <label for="telepon">Nomor Telepon:</label>
      <input type="tel" id="telepon" name="telepon" placeholder="08XXXXXXXXXX" required>

      <label for="produk">Layanan yang Dipesan:</label>
      <select id="produk" name="produk" required>
        <option value="">Pilih Layanan</option>
        <option value="Branding">Branding</option>
        <option value="Social Media Content">Social Media Content</option>
        <option value="Web Design">Web Design</option>
        <option value="UI/UX Design">UI/UX Design</option>
      </select>

      <label for="catatan">Catatan Tambahan:</label>
      <textarea id="catatan" name="catatan" placeholder="Tulis catat
