<!DOCTYPE html>
<html>
<head>
  <title>Login Admin</title>
</head>
<body>

<h2>Login Admin</h2>

<input type="text" id="username" placeholder="Username" value="nua.nrl">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<script>
async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  try {
    const res = await fetch("http://127.0.0.1:3000/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (data.success) {
      console.log("Login sukses, menyimpan token...");
      localStorage.setItem("token", data.token);
      alert("Login Berhasil! Klik OK untuk lanjut ke Generator.");
      window.location.href = "generator.html";
    } else {
      // INI YANG AKAN MUNCUL JIKA PASSWORD/USERNAME SALAH
      alert("Login Gagal: Username atau Password salah!");
      console.log("Pesan dari server:", data);
    }
  } catch (err) {
    // INI YANG AKAN MUNCUL JIKA SERVER MATI ATAU ERROR CORS
    alert("Koneksi gagal! Pastikan server Node.js sudah running di port 3000.");
    console.error("Error Detail:", err);
  }
}
</script>

</body>
</html>
