<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Generator - NUA Studio</title>
  <style>
    body { font-family: 'Poppins', sans-serif; background: #0f0f14; color: white; padding: 40px; }
    .box { max-width: 500px; margin: auto; background: #1a1a22; padding: 30px; border-radius: 12px; border: 1px solid #333; }
    h2 { color: #c6a96b; text-align: center; }
    input, select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #444; background: #2a2a35; color: white; box-sizing: border-box; }
    .btn-gen { width: 100%; padding: 14px; background: #20036e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
    .result { margin-top: 30px; padding: 20px; background: #000; border-radius: 10px; display: none; }
    .link-box { background: #222; padding: 10px; border-radius: 5px; font-size: 11px; word-break: break-all; margin: 10px 0; color: #888; }
    .action-btn { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
    .btn-wa { background: #25d366; color: white; }
    .btn-preview { background: #fff; color: #000; }
    .logout-btn { background: none; color: #ff4444; border: none; cursor: pointer; display: block; margin: 20px auto; font-size: 14px; }
  </style>
</head>
<body>

<div class="box">
  <h2>Invoice Generator</h2>
  <input type="text" id="nama" placeholder="Nama Client">
  <select id="produk">
    <option value="">Pilih Layanan</option>
    <option value="Branding Design">Branding Design</option>
    <option value="Social Media Content">Social Media Content</option>
    <option value="UI/UX Design">UI/UX Design</option>
    <option value="Website Development">Website Development</option>
  </select>
  <input type="number" id="harga" placeholder="Harga (Contoh: 200000)">

  <button class="btn-gen" onclick="generate()">GENERATE INVOICE</button>

  <div class="result" id="resultArea">
    <p style="margin:0; color:#c6a96b; font-weight:bold;">Invoice Berhasil!</p>
    <div class="link-box" id="displayLink"></div>
    <button class="action-btn btn-preview" onclick="openLink()">Preview Online</button>
    <button class="action-btn btn-wa" onclick="sendWA()">Kirim via WhatsApp</button>
  </div>
  
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<script>
  // 1. CEK LOGIN
  if (localStorage.getItem("token") !== "authenticated_nua") {
    window.location.href = "login.html";
  }

  let currentLink = "";

  function generate() {
    const nama = document.getElementById("nama").value;
    const produk = document.getElementById("produk").value;
    const harga = document.getElementById("harga").value;

    if (!nama || !produk || !harga) {
      alert("Mohon isi semua data!");
      return;
    }

    const invID = "NUA-" + Date.now();
    // LINK GITHUB PAGES KAMU
    const baseUrl = "https://nuacreative.github.io/nua-web/invoice.html";
    
    // RAKIT LINK
    currentLink = `${baseUrl}?id=${invID}&nama=${encodeURIComponent(nama)}&produk=${encodeURIComponent(produk)}&harga=${harga}&v=${Date.now()}`;
    
    // TAMPILKAN HASIL
    document.getElementById("resultArea").style.display = "block";
    document.getElementById("displayLink").innerText = currentLink;
  }

  function openLink() { 
    if(currentLink) window.open(currentLink, "_blank"); 
  }

  function sendWA() {
    if (!currentLink) {
      alert("Generate invoice dulu!");
      return;
    }
    
    const namaClient = document.getElementById("nama").value;
    
    // Tulis pesan dengan Enter normal (seperti ngetik biasa)
    const pesan = `Halo *${namaClient}*,

Berikut adalah invoice resmi dari *NUA Studio*.

Silakan klik link di bawah ini untuk melihat detail tagihan:
${currentLink}

Terima kasih telah mempercayakan project Anda kepada kami!`;
    
    // Kode ini akan merapikan teksnya secara otomatis untuk WhatsApp
    window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`, "_blank");
  }

  function logout() {
    localStorage.removeItem("token");
    window.location.href = "login.html";
  }
</script>
</body>
</html>
