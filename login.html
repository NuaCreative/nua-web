<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login - NUA Studio Admin</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:#0f0f14;
      color:white;
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .box{
      width:100%;
      max-width:420px;
      background:#1a1a22;
      padding:35px;
      border-radius:14px;
      border:1px solid #333;
    }

    h2{
      color:#c6a96b;
      text-align:center;
      margin-top:0;
      margin-bottom:30px;
      font-weight:600;
      letter-spacing:1px;
    }

    input{
      width:100%;
      padding:14px;
      margin-bottom:20px;
      border-radius:10px;
      border:1px solid #444;
      background:#2a2a35;
      color:white;
      font-size:14px;
      font-family:'Poppins',sans-serif;
      outline:none;
    }

    input:focus{
      border-color:#c6a96b;
    }

    .btn-login{
      width:100%;
      padding:14px;
      background:#20036e;
      color:white;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
      font-size:15px;
      transition:.2s;
    }

    .btn-login:hover{
      opacity:.9;
    }

    .sub{
      text-align:center;
      color:#777;
      font-size:13px;
      margin-top:-15px;
      margin-bottom:25px;
    }

  </style>
</head>

<body>

  <div class="box">

    <h2>NUA ADMIN</h2>

    <p class="sub">
      Secure Access Panel
    </p>

    <input
      type="password"
      id="pass"
      placeholder="Masukkan Password"
    >

    <button
      class="btn-login"
      onclick="login()"
    >
      LOGIN
    </button>

  </div>

<script>

  function login(){

    const pass =
      document.getElementById("pass").value;

    if(pass === "nua2026"){

      localStorage.setItem(
        "token",
        "authenticated_nua"
      );

      window.location.href =
        "generator.html?v=" + Date.now();

    }else{

      alert("Password Salah!");

    }
  }

  // enter keyboard
  document
    .getElementById("pass")
    .addEventListener("keypress",function(event){

      if(event.key === "Enter"){
        login();
      }

    });

</script>

</body>
</html>
