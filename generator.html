<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Generator - NUA Studio</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:#0f0f14;
      color:white;
      padding:40px 20px;
      margin:0;
    }

    .box{
      max-width:520px;
      margin:auto;
      background:#1a1a22;
      padding:30px;
      border-radius:14px;
      border:1px solid #333;
    }

    h2{
      color:#c6a96b;
      text-align:center;
      margin-top:0;
      margin-bottom:30px;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:14px;
      margin-bottom:20px;
      border-radius:10px;
      border:1px solid #444;
      background:#2a2a35;
      color:white;
      font-size:14px;
      font-family:'Poppins',sans-serif;
      outline:none;
    }

    textarea{
      min-height:120px;
      resize:vertical;
      line-height:1.6;
    }

    input:focus,
    select:focus,
    textarea:focus{
      border-color:#c6a96b;
    }

    .btn-gen{
      width:100%;
      padding:14px;
      background:#20036e;
      color:white;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
      font-size:15px;
    }

    .btn-gen:hover{
      opacity:.9;
    }

    .result{
      margin-top:30px;
      padding:20px;
      background:#000;
      border-radius:12px;
      display:none;
    }

    .success{
      margin:0 0 15px;
      color:#c6a96b;
      font-weight:600;
    }

    .link-box{
      background:#222;
      padding:12px;
      border-radius:8px;
      font-size:11px;
      word-break:break-all;
      color:#888;
      line-height:1.6;
    }

    .action-btn{
      width:100%;
      padding:12px;
      margin-top:12px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      font-weight:600;
    }

    .btn-preview{
      background:white;
      color:black;
    }

    .btn-wa{
      background:#25d366;
      color:white;
    }

    .logout-btn{
      background:none;
      color:#ff4444;
      border:none;
      cursor:pointer;
      display:block;
      margin:25px auto 0;
      font-size:14px;
    }

  </style>
</head>

<body>

<div class="box">

  <h2>Invoice Generator</h2>

  <input
    type="text"
    id="nama"
    placeholder="Nama Client"
  >

  <select id="produk">
    <option value="">Pilih Layanan</option>
    <option value="Branding Design">Branding Design</option>
    <option value="Social Media Content">Social Media Content</option>
    <option value="UI/UX Design">UI/UX Design</option>
    <option value="Website Development">Website Development</option>
  </select>

  <textarea
    id="deskripsi"
    placeholder="Deskripsi Pesanan&#10;Contoh:&#10;Page 1 @30.000&#10;Page 2 @30.000"
  ></textarea>

  <input
    type="number"
    id="harga"
    placeholder="Harga"
  >

  <button
    class="btn-gen"
    onclick="generate()"
  >
    GENERATE INVOICE
  </button>

  <div class="result" id="resultArea">

    <p class="success">
      Invoice Berhasil!
    </p>

    <div class="link-box" id="displayLink"></div>

    <button
      class="action-btn btn-preview"
      onclick="openLink()"
    >
      Preview Online
    </button>

    <button
      class="action-btn btn-wa"
      onclick="sendWA()"
    >
      Kirim via WhatsApp
    </button>

  </div>

  <button
    class="logout-btn"
    onclick="logout()"
  >
    Logout
  </button>

</div>


<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// =========================
// FIREBASE CONFIG
// =========================
const firebaseConfig = {

  apiKey: "AIzaSyBszuuPUtsQrUqrIlQ6XqIKpmNq78JmZTw",

  authDomain: "nua-studio-15.firebaseapp.com",

  projectId: "nua-studio-15",

  storageBucket: "nua-studio-15.firebasestorage.app",

  messagingSenderId: "561626006704",

  appId: "1:561626006704:web:7343238d1ed23dcdb2e775"

};


// init firebase
const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


// =========================
// LOGIN CHECK
// =========================
if(localStorage.getItem("token") !== "authenticated_nua"){

  window.location.href =
    "login.html";

}

let currentLink = "";


// =========================
// GENERATE
// =========================
window.generate = async function(){

  const nama =
    document.getElementById("nama").value.trim();

  const produk =
    document.getElementById("produk").value;

  const deskripsi =
    document.getElementById("deskripsi").value.trim();

  const harga =
    document.getElementById("harga").value;

  // validasi
  if(!nama || !produk || !harga){

    alert("Mohon isi Nama, Layanan, dan Harga!");
    return;

  }

  // invoice id
  const invID =
    "NUA-" + Date.now();

  // simpan ke firestore
  await setDoc(
    doc(db, "invoices", invID),
    {
      nama,
      produk,
      deskripsi,
      harga,
      createdAt: new Date().toISOString()
    }
  );

  // LINK PENDEK
  currentLink =
    `https://nuacreative.github.io/nua-web/invoice.html?id=${invID}`;

  // tampilkan hasil
  document.getElementById("resultArea").style.display =
    "block";

  document.getElementById("displayLink").innerText =
    currentLink;

}


// =========================
// PREVIEW
// =========================
window.openLink = function(){

  if(!currentLink){

    alert("Generate invoice dulu!");
    return;

  }

  window.open(currentLink, "_blank");

}


// =========================
// WHATSAPP
// =========================
window.sendWA = function(){

  if(!currentLink){

    alert("Generate invoice dulu!");
    return;

  }

  const namaClient =
    document.getElementById("nama").value;

  const pesan =
`Halo *${namaClient}*,

Berikut invoice resmi dari *NUA Studio*.

Silakan cek melalui link berikut:
${currentLink}

Terima kasih telah mempercayakan project Anda kepada kami ✨`;

  window.open(
    `https://wa.me/?text=${encodeURIComponent(pesan)}`,
    "_blank"
  );

}


// =========================
// LOGOUT
// =========================
window.logout = function(){

  localStorage.removeItem("token");

  window.location.href =
    "login.html";

}

</script>

</body>
</html>
