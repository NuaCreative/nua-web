<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login - NUA Studio Admin</title>
  <style>
    body { font-family: 'Poppins', sans-serif; background: #0f0f14; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: #1a1a22; padding: 40px; border-radius: 12px; width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { color: #c6a96b; margin-bottom: 25px; letter-spacing: 2px; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: none; background: #2a2a35; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #20036e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    button:hover { background: #3d0fbf; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>NUA ADMIN</h2>
    <input type="password" id="pass" placeholder="Masukkan Password">
    <button onclick="login()">LOGIN</button>
  </div>

  <script>
  function login() {
    const pass = document.getElementById("pass").value;
    
    // Pastikan password sesuai dengan keinginanmu
    if (pass === "nua2026") {
      localStorage.setItem("token", "authenticated_nua");
      
      // KUNCI PERBAIKAN: Menambahkan timestamp agar browser tidak pakai cache lama
      window.location.href = "generator.html?v=" + Date.now();
    } else {
      alert("Password Salah!");
    }
  }

  // Tambahan: Biar bisa login pakai tombol 'Enter' di keyboard
  document.getElementById("pass").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      login();
    }
  });
</script>
  </script>
</body>
</html>
